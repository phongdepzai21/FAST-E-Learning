<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST E-Learning - Đào tạo An toàn thực phẩm</title>
    <!-- Optimized Favicon (Circle Logo for Browser Tab) -->

    <!-- Network Optimizations -->
    <link rel="preconnect" href="https://esm.sh">
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    
    <!-- Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preconnect for Dropbox Content (Direct DL) -->
    <link rel="preconnect" href="https://dl.dropboxusercontent.com">
    <link rel="preconnect" href="https://www.dropbox.com">

    <!-- Preload Logo (Critical for Header LCP) -->
    <link rel="preload" as="image" 
          href="https://dl.dropboxusercontent.com/scl/fi/vujray2dqinzjgvifv5ic/logo-007c76.jpg?rlkey=82ta74w701800wvx50c08aoyt&st=k7c2htcn" 
          fetchpriority="high">

    <!-- Preload Hero Image (WebP Optimized) -->
    <link rel="preload" as="image" 
          href="https://images.unsplash.com/photo-1504674900247-0877df9cc836?fm=webp&fit=crop&q=50&w=1920" 
          imagesrcset="
            https://images.unsplash.com/photo-1504674900247-0877df9cc836?fm=webp&fit=crop&q=50&w=640 640w,
            https://images.unsplash.com/photo-1504674900247-0877df9cc836?fm=webp&fit=crop&q=50&w=1024 1024w,
            https://images.unsplash.com/photo-1504674900247-0877df9cc836?fm=webp&fit=crop&q=50&w=1920 1920w"
          imagesizes="100vw"
          fetchpriority="high">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              'primary-foreground': 'var(--color-primary-foreground)',
              background: 'var(--color-background)',
              surface: 'var(--color-surface)',
              text: 'var(--color-text)',
              'text-muted': 'var(--color-text-muted)',
            }
          }
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Added font for Certificate -->
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #007c76;
            --color-primary-foreground: #ffffff;
            --color-background: #f8fafc;
            --color-surface: #ffffff;
            --color-text: #374151;
            --color-text-muted: #6b7280;
        }

        .theme-inverted {
            --color-primary: #ffffff;
            --color-primary-foreground: #007c76;
            --color-background: #007c76;
            --color-surface: #006963;
            --color-text: #ffffff;
            --color-text-muted: #ccfbf9;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            scroll-behavior: smooth; 
            background-color: var(--color-background); 
            color: var(--color-text);
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-background); }
        ::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse-slow { animation: pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .hover-lift { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .hover-lift:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -15px rgba(0, 124, 118, 0.15); border-color: rgba(0, 124, 118, 0.2); }
        .hover-lift-subtle { transition: all 0.3s ease; }
        .hover-lift-subtle:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.08); }
        .gradient-text-gold { background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #fcd34d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-text-primary { background: linear-gradient(135deg, #007c76 0%, #0d9488 50%, #2dd4bf 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes pulseSlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    
    <script type="importmap">
{

    "firebase/auth": "https://esm.sh/firebase@10.13.1/auth",
    "firebase/storage": "https://esm.sh/firebase@10.13.1/storage",
    "firebase/firestore": "https://esm.sh/firebase@10.13.1/firestore",
    "@emailjs/browser": "https://esm.sh/@emailjs/browser@4.3.0",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
