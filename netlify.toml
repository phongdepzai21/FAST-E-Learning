[build]
  functions = "netlify/functions"
  publish = "dist"

[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/payment/webhook"
  to = "/.netlify/functions/sepay-webhook"
  status = 200

[[redirects]]
  from = "/api/sepay/webhook"
  to = "/.netlify/functions/sepay-webhook"
  status = 200

[[redirects]]
  from = "/api/check-payment"
  to = "/.netlify/functions/check-payment"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
